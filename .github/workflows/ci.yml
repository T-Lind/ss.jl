name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a superseded run of the same branch has nothing left to tell us
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: julia ${{ matrix.julia }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 1.9 is the declared floor in Project.toml, so it is tested as well
        # as the current release; the suite is pure stdlib, so the matrix
        # covers OS differences rather than dependency resolution
        julia: ['1.9', '1']
        os: [ubuntu-latest]
        include:
          - julia: '1'
            os: windows-latest
          # one multi-threaded lane: the panel hands each request to
          # Threads.@spawn instead of @async, and a guarded test asserts a
          # slow request doesn't block a concurrent one. With no thread
          # setting that assertion always skips, so a revert back to @async
          # would pass every other lane silently — this is the one entry that
          # would catch it. Kept singular: single-threaded is also a real
          # configuration users run (`julia --project scripts/panel.jl`).
          - julia: '1'
            os: ubuntu-latest
            threads: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: ${{ matrix.threads || 1 }}

  scripts:
    name: reference mission runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      # the TOML path is how most people will drive this, and it exercises
      # config parsing, the full design chain and the summary writer at once
      - name: fly missions/moonshot.toml
        run: julia --project=. scripts/run_mission.jl missions/moonshot.toml
      - name: reference verification report
        run: julia --project=. scripts/verify.jl --output=output/verification.toml
      - name: retain verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission-verification
          path: output/verification.toml
      - name: regenerate geometry
        run: julia --project=. scripts/make_meshes.jl
      # the rendezvous demo asserts its own result (the CW design has to land
      # within 500 m under nonlinear propagation), so running it is a test —
      # and it is the one script the unit suite does not reach
      - name: two-impulse rendezvous
        run: julia --project=. scripts/run_rendezvous.jl
      # Committed plots/CSVs are historical snapshots. Current results are
      # validated against physical tolerances above and retained per run;
      # byte equality across Julia releases is not a numerical accuracy test.
      - name: generate current mission products
        run: julia --project=. scripts/run_moonshot.jl
      - name: retain current mission products
        uses: actions/upload-artifact@v4
        with:
          name: reference-mission-products
          path: |
            output/moonshot_*.csv
            output/moonshot_summary.txt
            geometry/*.stl
      # The landing and the trip home are exercised as a smoke test, not
      # diffed: the search layers under them (the braking shooter, the
      # rendezvous window sweep, the trans-Earth secant) are stable in what
      # they land on and not in the last bit of it. This runs last because it
      # rewrites output/landing_*.csv.
      - name: fly the lunar landing and come home
        run: julia --project=. scripts/run_landing.jl
      # and the same descent onto a smooth sphere, which is the configuration
      # every figure predating terrain was flown against
      - name: fly it onto a smooth sphere
        run: SS_PLAIN=1 julia --project=. scripts/run_landing.jl

  ui:
    name: browser layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # static module syntax and "every /static import exists" — exactly the
      # rules build/build_app.jl enforces, moved in front of a PR instead of a
      # tagged release
      - name: static integrity
        run: node scripts/check_static.mjs
      # the pure helpers with no Julia equivalent: angle wrap, dateline split,
      # chart extent
      - name: UI helper tests
        run: node --test test/*.test.mjs

  parity:
    name: Julia and browser physics parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: compare all browser physics against Julia
        working-directory: web
        run: npm test
        env:
          SSJL_REQUIRE_JULIA: '1'

  host:
    name: rust host
    runs-on: windows-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      # the updater's release-tag parsing and version comparison — logic no
      # Julia test reaches
      - name: cargo test
        run: cargo test --locked
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
