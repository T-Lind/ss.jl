    PUP = [0, 1, 0];
    // the deflector only has anything to turn while the vehicle is still on
    // or just off the table
    TRENCH = st.h < 260;
    return {
      world: 'pad', st, cam, craftM, craftPos: st.pos,
      earthC: [0, -RE, 0], moonC: null,
      eMat: anchorMat(run.sites.launch_lat, run.sites.launch_lon),
      spin: OME*Math.max(simT, 0), near: 1,
      loud: Math.min(1, st.thr/9.5e5)*Math.exp(-st.h/12000),
      engI: st.thr > 0 ? Math.min(1, st.thr/9.5e5)*(0.8 + 0.4*Math.random()) : 0,
      engW: noz, engC: [1.0, 0.55, 0.22],
      spawn: dt => spawnAscent(dt, st, rocketVel, noz, bnoz),
    };
  }
  if (ph.w === 'eci') {
    const cs = cisState(simT);
    // model x = 0 at the last stage's base, so the stack sits on the track
    const ls = secDraw.find(s => s.name === LASTST);
    const base = mBasis(cs.bx, cs.by, cs.bz, cs.pos);
    const craftM = ls ? mMul(base, mTrans([-ls.x0, 0, 0])) : base;
    const cam = cameraEci(simT, cs, ph, craftM);
    const noz = V.add(cs.pos, V.scale(cs.bx, -0.5));
    PUP = null;                        // inertial frame: no up, no buoyancy
    TRENCH = false;
    return {
      world: 'eci', cs, cam, craftM, craftPos: cs.pos, sun: SUNE,
      earthC: [0, 0, 0], moonC: cs.moon,
      eMat: [1,0,0, 0,1,0, 0,0,1], spin: OME*simT, near: 0,
      loud: cs.burning ? 0.5 : 0,
      engI: cs.burning ? 0.9 + 0.4*Math.random() : 0,
      engW: noz, engC: [1.0, 0.55, 0.22],
      spawn: dt => { if (cs.burning) spawnTli(dt, cs); },
    };
  }
  const es = entState(simT);
  const pr = podRange();
  const bze = [0, 0, 1];
  // anchor the heat-shield apex on the trajectory, not the section origin
  const xb = pr ? capStations(pr.x0).xb : 0;
  const craftM = mMul(mBasis(es.bx, V.cross(bze, es.bx), bze, es.pos),
                      mTrans([-xb, 0, 0]));
  const cam = cameraEntry(simT, es, craftM);
  PUP = [0, 1, 0];
  TRENCH = false;
  return {
    world: 'entry', es, cam, craftM, craftPos: es.pos,
    earthC: [0, -RE, 0], moonC: null,
    eMat: anchorMat(run.sites.splash_lat, run.sites.splash_lon),
    spin: 0, near: 0,
    loud: Math.min(1, es.g/6 + (simT > tDrog ? 0.25 : 0)),
    engI: Math.min(0.50, es.q/240),
    engW: es.pos, engC: [1.0, 0.5, 0.25],
    spawn: dt => spawnEntry(dt, es),
  };
}

function spawnAscent(dt, st, rocketVel, noz, bnoz) {
  if (!(st.thr > 0)) {
    if (st.mach > 0.92 && st.mach < 1.08 && st.q > 12) spawnVapor(st, rocketVel);
    return;
  }
  const E = 1 + 3.4*(1 - Math.exp(-st.h/42000));
  const tn = Math.min(1, st.thr/9.5e5);
  const nf = Math.round(16*Math.sqrt(tn)*Math.min(2, 60*dt));
  for (let i = 0; i < nf; i++) {
    const vex = V.add(V.add(rocketVel,
                      V.scale(st.dir, -(95+rnd(45))*Math.min(E, 2.2) - 0.12*st.v)),
                      jit(7*E));
    spawn(V.add(noz, jit(0.3*DIA)), vex, rnd(0.42, 0.18), DIA*(0.55+rnd(0.3))*E,
          DIA*2.0*E, 0);
  }
  if (st.h < 300 && st.thr > 1e5) {
    // The trench decides where the smoke goes: the deflector turns the plume
    // and it leaves the mouth at grade, carrying the deluge steam with it.
    // Only what spills around the table rises beside the vehicle.
    for (let i = 0; i < Math.min(7, 60*dt*5); i++)
      spawn([rnd(trHW()*0.8, -trHW()*0.8), rnd(6, 0.8), TR_Z1 + rnd(7, -3)],
            [rnd(7,-7), rnd(10,2), 26 + rnd(32)], rnd(18,9), rnd(9,5), 3.4, 1);
    for (let i = 0; i < Math.min(3, 60*dt*2); i++) {
      const a = rnd(2*Math.PI), r = mntR()*rnd(1.6, 0.85);
      spawn([r*Math.cos(a), PADH + rnd(3,-4), r*Math.sin(a)],
            [3*Math.cos(a) + rnd(6,-6), rnd(7,1), 3*Math.sin(a) + rnd(6,-6)],
            rnd(13,6), rnd(7,4), 2.6, 1);
    }
  } else if (st.h < 45000 && Math.random() < 60*dt*0.5) {
    spawn(V.add(noz, jit(0.5)), V.add(rocketVel, V.scale(st.dir, -60)),
          rnd(2.2, 0.9), DIA*1.1*E, DIA*3.0, 1);
  }
  // one plume per lit strap-on, shorter and narrower than the core's
  for (const bn of (bnoz || [])) {
    for (let i = 0; i < Math.max(1, Math.round(nf*0.45)); i++) {
      const vex = V.add(V.add(rocketVel,
                        V.scale(st.dir, -(80+rnd(38))*Math.min(E, 2.2) - 0.12*st.v)),
                        jit(6*E));
      spawn(V.add(bn, jit(0.22*DIA)), vex, rnd(0.34, 0.15),
            DIA*(0.34+rnd(0.20))*E, DIA*1.5*E, 0);
    }
  }
  if (st.mach > 0.92 && st.mach < 1.08 && st.q > 12) spawnVapor(st, rocketVel);
}
function spawnVapor(st, rocketVel) {
  const ring = V.add(st.pos, V.scale(st.dir, LEN*0.62));
  for (let i = 0; i < 3; i++)
    spawn(V.add(ring, jit(DIA*0.8)), V.add(rocketVel, jit(4)), 0.09,
          DIA*rnd(2.4, 1.4), 18, 2);
}
function spawnTli(dt, cs) {
  // exhaust leaves the bell aft of the kick stage and is carried by the
  // craft's own velocity, so what you see is the *relative* recession
  const noz = V.add(cs.pos, V.scale(cs.bx, -0.4));
  const n = Math.min(12, Math.round(60*dt*10));
  for (let i = 0; i < n; i++)
    spawn(V.add(noz, jit(0.22)),
          V.add(cs.vel, V.add(V.scale(cs.bx, -(40 + rnd(60))), jit(7))),
          rnd(0.35, 0.15), rnd(1.1, 0.5), 2.6, 0);
}
function spawnEntry(dt, es) {
  const I = Math.min(1, es.q/120);
  if (I > 0.015) {
    // Wake particles carry most of the capsule's own velocity. Left at rest
    // in the world frame they fall 8 km behind within one frame and no trail
    // is ever visible; entrained in the near wake they stream backwards at a
    // few hundred m/s *relative to the pod*, which is what you actually see.
    const vC = V.scale(es.vdir, es.v);
    const rel = r => V.sub(vC, V.scale(es.vdir, r));
    // shock layer: stands just ahead of the blunt face, co-moving with it
    for (let i = 0; i < Math.min(3, Math.round(60*dt*(1 + 4*I))); i++)
      spawn(V.add(V.add(es.pos, V.scale(es.vdir, 0.9)), jit(0.55)),
            V.add(rel(20 + 60*I), jit(5*I + 2)),
            rnd(0.22, 0.09), (0.34 + 0.55*I)*rnd(1.2, 0.7), 1.1*I + 0.4, 0);
    // additive sprites saturate fast, so the wake is many small short-lived
    // puffs rather than a few big ones
    const n = Math.min(11, Math.round(60*dt*(4 + 22*I)));
    for (let i = 0; i < n; i++) {
      const back = rnd(14*I + 2);
      spawn(V.add(V.sub(es.pos, V.scale(es.vdir, back)), jit(0.5 + back*0.05)),
            V.add(rel((40 + 220*I)*(0.7 + rnd(0.6))), jit(18*I + 4)),
            rnd(0.55, 0.20), (0.36 + 0.85*I)*rnd(1.3, 0.8), 2.2*I + 0.6, 0);
    }
    // wake smoke: non-buoyant while hypersonic, otherwise it climbs away
    // from the trail instead of following it
    if (Math.random() < 60*dt*0.9)
      spawn(V.sub(es.pos, V.scale(es.vdir, 2.5)), rel(30 + 130*I),
            rnd(2.6, 1.1), 2.0 + 3.5*I, 5, es.v > 400 ? 3 : 1);
  }
  if (splashed && parts.length < 420 && simT < tSplash + 2.5) {
    for (let i = 0; i < 14; i++)
      spawn([rnd(2,-2), rnd(1.5,0.2), rnd(2,-2)],
            [rnd(9,-9), rnd(11,3), rnd(9,-9)], rnd(1.4,0.5), rnd(1.5,0.7), 1.4, 2);
  }
}

function drawScene(sc) {
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth*dpr | 0, h = cv.clientHeight*dpr | 0;
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  gl.viewport(0, 0, w, h);
  const cam = sc.cam, asp = w/h;
  const inCab = cam.mode === 'cabin' || cam.mode === 'window';
  const sun = sc.sun || SUN;
  const view = mLookAt(cam.eye, cam.look, cam.up);
  // the console sits ~0.3 m from the crew's eye, so the cabin needs a much
  // nearer clip plane than the outside views
  const proj = mPersp(cam.fov, asp, inCab ? 0.04 : 0.35, 3.0e6);
  const camAlt = Math.max(V.len(V.sub(cam.eye, sc.earthC)) - RE, 2);
  const dens = Math.exp(-camAlt/9000);
  const fogCol = [0.62*dens + 0.02, 0.75*dens + 0.04, 0.92*dens + 0.08];
  const fogDen = sc.world === 'eci' ? 0 : 5e-5*dens + 2e-7;
  gl.enable(gl.DEPTH_TEST);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  // planet pass (Earth + Moon + sky + stars), camera-relative in f64
  gl.useProgram(SPACE.p);
  gl.depthMask(false);
  const camF = V.norm(V.sub(cam.look, cam.eye));
  const camR = V.norm(V.cross(camF, cam.up)), camU = V.cross(camR, camF);
  gl.uniform3fv(SPACE.u.uR, camR); gl.uniform3fv(SPACE.u.uU, camU);
  gl.uniform3fv(SPACE.u.uF, camF); gl.uniform3fv(SPACE.u.uSun, sun);
  gl.uniform1f(SPACE.u.uTan, Math.tan(cam.fov/2));
  gl.uniform1f(SPACE.u.uAsp, asp);
  gl.uniform3fv(SPACE.u.uEc, V.sub(sc.earthC, cam.eye));
  gl.uniform1f(SPACE.u.uER, RE);
  gl.uniform3fv(SPACE.u.uMc, sc.moonC ? V.sub(sc.moonC, cam.eye) : [0,0,0]);
  gl.uniform1f(SPACE.u.uMR, RM);
  gl.uniform1f(SPACE.u.uHasMoon, sc.moonC ? 1 : 0);
  gl.uniformMatrix3fv(SPACE.u.uEMat, false, sc.eMat);
  gl.uniform1f(SPACE.u.uSpin, sc.spin);
  gl.uniform1f(SPACE.u.uNear, sc.near);
  gl.uniform1f(SPACE.u.uScorch, scorch);
  gl.uniform3fv(SPACE.u.uCamW, cam.eye);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, landTex);
  gl.uniform1i(SPACE.u.uLand, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, skyBuf);
  const aQ = gl.getAttribLocation(SPACE.p, 'aP');
  gl.enableVertexAttribArray(aQ);
  gl.vertexAttribPointer(aQ, 2, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 6);
  gl.depthMask(true);

  // lit meshes
  const rotSun = V.sub(mApply(view, V.add(cam.eye, sun)), mApply(view, cam.eye));
  const engV = mApply(view, sc.engW);
  // a cabin has its own lighting: raise the fill so interior surfaces facing
  // away from the sun still read (the plasma/engine point light still applies)
  const amb = inCab ? 0.52 : sc.world === 'eci' ? 0.24 : 0.30 + 0.16*dens;
  beginMeshes(view, V.norm(rotSun), fogDen, fogCol, amb, sc.engI, engV, sc.engC);
  // from inside, the cabin is drawn and the window panes are dropped, so the
  // apertures in the pressure shell become real openings onto the world
  const skip = s => secGone[s.name] ||
    (s.name === 'cabin' ? !inCab : s.name === 'glass' ? inCab : false);

  if (sc.world === 'pad') {
    // The pad world runs all the way to orbit insertion, but the complex is
    // 250 m across: from 20 km up it is a couple of pixels, so beyond that
    // it is not drawn at all. The ground cameras never move, so they keep it.
    if (V.len(cam.eye) < 20000) {
      drawWhole(padBuf, padN, mIdent(), proj);
      drawWhole(towerBuf, towerN, mIdent(), proj);
      bindMeshBuf(armBuf);
      for (const a of armDraw) drawRange(armMat(a, simT), proj, a.first, a.count);
    }
    const rocketM = sc.craftM;
    bindMeshBuf(rocketBuf);
    for (const s of secDraw) {
      if (skip(s)) continue;
      drawRange(rocketM, proj, s.first, s.count);
    }
    for (const d of debris) {
      const dbz = [0,0,1], dby = V.cross(dbz, d.bx);
      const m = mMul(mBasis(d.bx, dby, dbz, d.p), mRotAxis(d.ax, d.a));
      drawRange(m, proj, d.draw.first, d.draw.count);
    }
    drawClouds(view, proj, fogCol, fogDen, cam.eye[1]);
  } else if (sc.world === 'eci') {
    const cs = sc.cs;
    const stackM = sc.craftM;
    bindMeshBuf(rocketBuf);
    // craft = whatever is still attached: kick stage + capsule, until the
    // stage is jettisoned ahead of entry interface
    for (const s of secDraw) {
      if (s.name === 'pod' || s.name === 'cabin' || s.name === 'glass') {
        if (!skip(s)) drawRange(stackM, proj, s.first, s.count);
        continue;
      }
      if (s.name !== LASTST) continue;
      if (!(simT >= tHand)) drawRange(stackM, proj, s.first, s.count);
      else {
        // jettisoned kick stage drifting away behind
        const off = V.scale(cs.bx, -(3 + 0.6*(simT - tHand)));
        const m2 = mMul(mMul(mTrans(off), stackM), mRotAxis([0,0,1], 0.05*(simT - tHand)));
        drawRange(m2, proj, s.first, s.count);
      }
    }
  } else {
    const es = sc.es;
    const podM = sc.craftM;
    bindMeshBuf(rocketBuf);
    for (const s of secDraw)
      if ((s.name === 'pod' || s.name === 'cabin' || s.name === 'glass') && !skip(s))
        drawRange(podM, proj, s.first, s.count);
    // parachutes: canopy axis opposite the velocity, scale-in on deploy
    const drawChute = (buf, n, t0, lineLen) => {
      if (!isFinite(t0) || simT < t0) return;
      const s = Math.min(1, (simT - t0)/1.2);
      const cx = V.scale(es.vdir, -1), cz = [0,0,1], cyv = V.cross(cz, cx);
      const cp = V.add(es.pos, V.scale(cx, 2.2 + lineLen*s));
      drawWhole(buf, n, mBasis(cx, cyv, cz, cp, 0.15 + 0.85*s), proj);
    };
    if (isFinite(tDrog) && !(simT >= tMain)) drawChute(drogueBuf, drogueN, tDrog, 3.2);
    else drawChute(mainBuf, mainN, tMain, 8.5);
    drawClouds(view, proj, fogCol, fogDen, cam.eye[1]);
  }

  drawParticles(view, proj, cam.fov,
                sc.world === 'entry' ? [0.60, 0.50, 0.45] : undefined);
}
function drawClouds(view, proj, fogCol, fogDen, camY) {
  if (camY > 45000) return;
  gl.useProgram(CLOUD.p);
  gl.uniformMatrix4fv(CLOUD.u.uMV, false, view);
  gl.uniformMatrix4fv(CLOUD.u.uPr, false, proj);
  gl.uniform1f(CLOUD.u.uY, 1900);
  gl.uniform1f(CLOUD.u.uT, simT % 86400);
  gl.uniform1f(CLOUD.u.uCamY, camY);
  gl.uniform3fv(CLOUD.u.uFogCol, fogCol);
  gl.uniform1f(CLOUD.u.uFogDen, fogDen);
  gl.bindBuffer(gl.ARRAY_BUFFER, cloudBuf);
  const aC = gl.getAttribLocation(CLOUD.p, 'aP');
  gl.enableVertexAttribArray(aC);
  gl.vertexAttribPointer(aC, 2, gl.FLOAT, false, 0, 0);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  gl.drawArrays(gl.TRIANGLES, 0, 6);
  gl.depthMask(true);
  gl.disable(gl.BLEND);
}

// -------------------------------------------------------------------- hud --
function fmtClock(t) {
  const s = Math.abs(t);
  if (s < 3600)
    return (t < 0 ? 'T–' : 'T+') + String(Math.floor(s/60)).padStart(2,'0') +
           ':' + String(Math.floor(s%60)).padStart(2,'0');
  const d = Math.floor(s/86400), hh = Math.floor(s%86400/3600),
        mm = Math.floor(s%3600/60), ss = Math.floor(s%60);
  return 'T+' + (d ? d + 'd ' : '') + String(hh).padStart(2,'0') + ':' +
         String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
}
const fmtDist = m => m < 1e6 ? (m/1000).toFixed(1) + ' km' :
  m < 1e8 ? Math.round(m/1000).toLocaleString() + ' km' :
  (m/1e6).toFixed(0) + ',000 km';
function drawHUD(sc, ph) {
  const ck = $('clock');
  ck.childNodes[0].nodeValue = fmtClock(simT);
  ck.classList.toggle('go', simT >= 0);
  $('phase').textContent = ph.n + (warpEff > 1.5 ? ` · ×${Math.round(warpEff)}` : '');
  let rows;
  if (sc.world === 'pad') {
    const st = sc.st, acc = st.m > 0 ? st.thr/st.m/9.81 : 0;
    rows = [['ALTITUDE', st.h < 1e4 ? st.h.toFixed(0)+' m' : (st.h/1000).toFixed(1)+' km'],
            ['VELOCITY', st.v.toFixed(0) + ' m/s'],
            ['MACH', st.h > 82000 ? '—' : st.mach.toFixed(2)],
            ['ACCEL', acc.toFixed(2) + ' g'],
            ['DYN PRESS', st.q.toFixed(1) + ' kPa'],
            ['DOWNRANGE', (st.dr/1000).toFixed(1) + ' km'],
            ['CAMERA', sc.cam.mode.toUpperCase()]];
  } else if (sc.world === 'eci') {
    const cs = sc.cs;
    rows = [['EARTH', fmtDist(cs.rE - RE)],
            ['MOON', fmtDist(cs.rM - RM)],
            ['VELOCITY', (cs.speed/1000).toFixed(2) + ' km/s'],
            ['MET', (simT/86400).toFixed(2) + ' days'],
            ['CAMERA', sc.cam.mode.toUpperCase()]];
  } else {
    const es = sc.es;
    rows = [['ALTITUDE', es.h < 1e4 ? es.h.toFixed(0)+' m' : (es.h/1000).toFixed(1)+' km'],
            ['VELOCITY', es.v.toFixed(0) + ' m/s'],
            ['G-LOAD', es.g.toFixed(1) + ' g'],
            ['HEATING', es.q.toFixed(0) + ' W/cm²'],
            ['CAMERA', sc.cam.mode.toUpperCase()]];
  }
  $('stats').innerHTML = rows.map(r => `<b>${r[0]}</b><span>${r[1]}</span>`).join('<br>');
}
// phase-segmented timeline (equal width per phase — a broken time axis)
const seekCv = $('seek');
function segX(t, w) {
  const np = PH.length, sw = w/np;
  for (let i = 0; i < np; i++) {
    const p = PH[i];
    if (t < p.t1 || i === np-1)
      return i*sw + Math.max(0, Math.min(1, (t - p.t0)/(p.t1 - p.t0)))*sw;
  }
  return w;
}
function drawSeek() {
  const ctx = seekCv.getContext('2d');
  const w = seekCv.clientWidth, h = 18;
  if (seekCv.width !== w) { seekCv.width = w; seekCv.height = h; }
  ctx.clearRect(0, 0, w, h);
  const np = PH.length, sw = w/np;
  for (let i = 0; i < np; i++) {
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    ctx.fillRect(i*sw + 1, 9, sw - 2, 2);
  }
  const x = segX(simT, w);
  for (let i = 0; i < np; i++) {
    const x0 = i*sw + 1, x1 = Math.min(x, (i+1)*sw - 1);
    if (x1 > x0) { ctx.fillStyle = '#f2c14e'; ctx.fillRect(x0, 9, x1 - x0, 2); }
  }
  for (const q of toasts) {
    ctx.fillStyle = simT >= q.t ? '#f2c14e' : 'rgba(255,255,255,0.45)';
    ctx.beginPath(); ctx.arc(segX(q.t, w), 10, 2.2, 0, 7); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '8px system-ui';
  for (let i = 0; i < np; i++) ctx.fillText(PH[i].n, i*sw + 3, 6);
}
seekCv.onclick = e => {
  if (!started) return;
  const w = seekCv.clientWidth, np = PH.length, sw = w/np;
  const i = Math.min(np-1, Math.floor(e.offsetX/sw));
  const f = (e.offsetX - i*sw)/sw;
  const p = PH[i];
  seekTo(p.t0 + f*(p.t1 - p.t0));
};
function seekTo(t) {
  simT = Math.max(-15, Math.min(t, tEnd - 0.5));
  for (const q of toasts) q.done = simT >= q.t;
  parts.length = 0; debris.length = 0;
  splashed = simT >= tSplash;
  warpCur = 1;
  ended = false; running = true;
  $('overlay').classList.add('hidden');
}

// --------------------------------------------------------------- controls --
function chipRow(el, items, cur, cb) {
  el.innerHTML = '';
  for (const it of items) {
    const c = document.createElement('span');
    c.className = 'chip' + (it === cur ? ' on' : '');
    c.textContent = it;
    c.onclick = () => { cb(it); chipRow(el, items, it, cb); };
    el.appendChild(c);
  }
}
function initControls() {
  chipRow($('cams'), CAMS, 'auto', m => camMode = m);
  const sp = ['auto','×1','×2','×4','×10','×100','×1k','×10k','skip ›'];
  const setSpeed = s => {
    if (s === 'skip ›') {
      const nxt = toasts.find(q => q.t > simT + 2);
      if (nxt) seekTo(nxt.t - 3);
      chipRow($('speed'), sp, manualWarp > 0 ? '×' + manualWarp : 'auto', setSpeed);
      return;
    }
    manualWarp = s === 'auto' ? 0 :
      +s.slice(1).replace('k', '000');
  };
  chipRow($('speed'), sp, 'auto', setSpeed);
  const inside = () => camMode === 'cabin' || camMode === 'window';
  cv.addEventListener('pointerdown', e => {
    if (camMode !== 'free' && !inside()) return;
    cv.setPointerCapture(e.pointerId);
    cv._drag = [e.clientX, e.clientY];
  });
  cv.addEventListener('pointermove', e => {
    if (!cv._drag) return;
    const dx = e.clientX - cv._drag[0], dy = e.clientY - cv._drag[1];
    if (inside()) {
      // turn your head on the couch rather than orbiting the capsule
      headYaw = Math.min(1.5, Math.max(-1.5, headYaw + dx*0.005));
      headPitch = Math.min(1.2, Math.max(-1.2, headPitch - dy*0.005));
    } else {
      freeYaw += dx*0.006;
      freePitch = Math.min(1.4, Math.max(-1.2, freePitch + dy*0.004));
    }
    cv._drag = [e.clientX, e.clientY];
  });
  cv.addEventListener('pointerup', () => cv._drag = null);
  cv.addEventListener('wheel', e => {
    if (camMode !== 'free') return;
    e.preventDefault();
    freeDist = Math.min(LEN*60, Math.max(6, (freeDist || LEN*3.6)*(e.deltaY > 0 ? 1.15 : 0.87)));
  }, { passive: false });
  window.addEventListener('keydown', e => {
    if (e.key === ' ') { running = !running; e.preventDefault(); }
    const i = +e.key;
    if (i >= 1 && i <= CAMS.length) {
      camMode = CAMS[i-1];
      chipRow($('cams'), CAMS, camMode, m => camMode = m);
    }
    if (e.key === 'm') muted = !muted;
  });
}

function showEndCard() {
  const m = run.metrics;
  // the card reports whatever this trajectory actually produced
  const rows = [];
  const row = (k, ok, v) => { if (ok) rows.push(`<tr><td>${k}</td><td>${v}</td></tr>`); };
  row('mission elapsed', isFinite(m.t_days), `${(m.t_days || 0).toFixed(2)} days`);
  row('perilune', isFinite(m.perilune_km),
      `${(m.perilune_km || 0).toFixed(0)} km (day ${(m.t_perilune_d || 0).toFixed(1)})`);
  row('entry interface', isFinite(m.ei_v_ms), `${((m.ei_v_ms || 0)/1000).toFixed(2)} km/s`);
  row('peak load · heating', isFinite(m.peak_g),
      `${(m.peak_g || 0).toFixed(1)} g · ${(m.peak_q_wcm2 || 0).toFixed(0)} W/cm²`);
  row('splashdown', isFinite(m.splash_lat),
      `${(m.splash_lat || 0).toFixed(1)}°, ${(m.splash_lon || 0).toFixed(1)}° ` +
      `at ${(m.v_splash || 0).toFixed(1)} m/s`);
  $('ov_title').textContent = isFinite(tSplash) ? 'SPLASHDOWN' : 'END OF MISSION';
  $('ov_sub').textContent = isFinite(tSplash) ?
    'pod recovered — mission complete' : (EVS.length ? EVS[EVS.length-1].s : '');
  $('ov_body').innerHTML = `<table>${rows.join('')}</table>`;
  $('ov_go').textContent = 'REPLAY';
  $('ov_go').classList.remove('hidden');
  $('overlay').classList.remove('hidden');
  $('overlay').onclick = () => {
    $('overlay').classList.add('hidden');
    scorch = 0; seekTo(-15);
  };
}

// ------------------------------------------------------------------- boot --
async function boot() {
  try {
    const [r1, r2] = await Promise.all([
      fetch('/api/run', { method: 'POST', body: qs }),
      fetch('/api/geometry', { method: 'POST', body: qs })]);
    run = await r1.json(); geo = await r2.json();
    if (!run.ok) throw new Error(run.error || 'mission failed');
    if (!geo.ok) throw new Error(geo.error || 'geometry failed');
    buildData();
    buildLiveryTex();
    buildRocket();
    buildStatics();
    buildLandTex();
    buildToasts();
    skyBuf = quadBuf();
    partDyn = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, partDyn);
    gl.bufferData(gl.ARRAY_BUFFER, partArr.byteLength, gl.DYNAMIC_DRAW);
    initControls();
    $('ov_sub').textContent =
      `${run.metrics.liftoff_t.toFixed(1)} t · ${LEN.toFixed(1)} m — ` +
      `around the Moon and home in ${run.metrics.t_days.toFixed(1)} days`;
    $('ov_go').classList.remove('hidden');
    $('overlay').onclick = () => {
      $('overlay').classList.add('hidden');
      initAudio();
      started = true; running = true;
    };
  } catch (e) {
    $('ov_sub').textContent = 'could not load the mission';
    $('err').textContent = String(e.message || e);
    $('err').classList.remove('hidden');
  }
}
boot();
requestAnimationFrame(frame);
</script>
